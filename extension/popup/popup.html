<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>MapleScouter Cloud Presets</h1>
      <button id="openOptions" class="link" title="Settings">&#9881;</button>
    </header>
    <div id="status" hidden></div>
    <section id="notOnSite" hidden>
      <p>Open <b>maplescouter.com</b> to read or import this browser's presets.</p>
      <button id="openSite">Open maplescouter.com/en/input</button>
    </section>
    <section id="localSection" hidden>
      <h2>Local presets (this browser)</h2>
      <div id="localSlots"></div>
      <div class="row">
        <button id="backupNow">Back up full state</button>
        <button id="restoreLatest">Restore latest backup</button>
      </div>
    </section>
    <section>
      <h2>Cloud presets</h2>
      <div id="cloudList"><p class="muted">Loading…</p></div>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
